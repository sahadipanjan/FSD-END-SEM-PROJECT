# =====================================================
# Campus Lost & Found Portal - Spring Boot Configuration
# Default Profile: dev-h2 (Zero-install fallback)
# Use SPRING_PROFILES_ACTIVE=mysql for MySQL 8
# =====================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev-h2}

server.port=${PORT:8080}

# Database Connection (MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_lost_found?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campus_user}
spring.datasource.password=${DB_PASSWORD:campus_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings (Max 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Security
# 256-bit Hex Secret Key
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Invite Code (Guards admin sign-up)
app.admin.invite-code=${ADMIN_INVITE_CODE:CAMPUS_ADMIN_2026}

# Optional Email Domain Restriction (empty = any valid email allowed)
app.auth.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:}

# Local File Storage Directory for Item Images
app.upload.dir=${UPLOAD_DIR:uploads}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
