# =====================================================
# Campus Lost & Found Portal - Spring Boot Configuration
# Fallback / Zero-Install Profile: H2 (File-based or Mem)
# =====================================================

# H2 File-based Database (stored in ./data/campusdb)
spring.datasource.url=jdbc:h2:file:./data/campusdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto create/update schema in H2 profile
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Web Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
